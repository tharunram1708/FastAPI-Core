name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: testing
      DEBUG: "true"
      AUTH_SECRET_KEY: dev-auth-secret-key-change-me-32-bytes
      API_KEY: dev-secret-key
      DATABASE_URL: sqlite:///./ci_test.db
      AUTO_CREATE_TABLES: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall app scripts tests

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -q

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          API_KEY: ${{ secrets.API_KEY }}
          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAME,API_KEY,AUTH_SECRET_KEY,DATABASE_URL,REDIS_URL,ALLOWED_ORIGINS
          script: |
            set -e

            if ! command -v docker >/dev/null 2>&1; then
              sudo dnf install -y docker
            fi

            sudo systemctl enable --now docker

            if [ -z "$API_KEY" ] || [ -z "$AUTH_SECRET_KEY" ]; then
              echo "API_KEY and AUTH_SECRET_KEY GitHub Secrets are required."
              exit 1
            fi

            DATABASE_URL="${DATABASE_URL:-sqlite:///./app.db}"
            REDIS_URL="${REDIS_URL:-redis://localhost:6379/0}"
            ALLOWED_ORIGINS="${ALLOWED_ORIGINS:-http://${{ secrets.EC2_HOST }}:8000}"

            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            sudo docker pull "$IMAGE_NAME:latest"

            sudo docker stop pythonproject4 || true
            sudo docker rm pythonproject4 || true

            sudo docker run -d \
              --name pythonproject4 \
              --restart unless-stopped \
              -p 8000:8000 \
              -e ENVIRONMENT=production \
              -e DEBUG=false \
              -e API_KEY="$API_KEY" \
              -e AUTH_SECRET_KEY="$AUTH_SECRET_KEY" \
              -e DATABASE_URL="$DATABASE_URL" \
              -e REDIS_URL="$REDIS_URL" \
              -e ALLOWED_ORIGINS="$ALLOWED_ORIGINS" \
              -e AUTO_CREATE_TABLES=false \
              -e SERVER_HOST=0.0.0.0 \
              -e SERVER_PORT=8000 \
              "$IMAGE_NAME:latest"

            sleep 5
            sudo docker ps --filter "name=pythonproject4"
            sudo docker logs --tail 100 pythonproject4
            sudo ss -ltnp | grep :8000

            sudo docker logout ghcr.io
